<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050a0f" />
  <title>Offline — Aethera</title>
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0e1a2b 0%, #050a0f 60%);
      color: #e8f4f8;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 32px 28px;
      border: 1px solid #1a3045;
      border-radius: 18px;
      background: rgba(10, 21, 32, 0.7);
      backdrop-filter: blur(8px);
    }
    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #050a0f;
      display: grid; place-items: center;
      box-shadow: 0 0 0 1px #1a3045, 0 12px 40px rgba(14, 165, 233, 0.18);
    }
    .logo img { width: 56px; height: 56px; border-radius: 12px; }
    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 22px;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    .accent { color: #38bdf8; }
    p { color: #98a8b6; font-size: 14px; line-height: 1.55; margin: 0 0 20px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #0ea5e9; color: white;
      padding: 12px 22px; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      transition: background .15s, transform .15s;
    }
    button:hover { background: #0284c7; }
    button:active { transform: scale(0.98); }
    .hint {
      margin-top: 18px; font-size: 12px; color: #6b7c8c;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img src="/icons/icon-192.png" alt="Aethera" /></div>
    <h1>Tidak ada <span class="accent">koneksi</span></h1>
    <p>Kamu sedang offline. Beberapa data tersimpan lokal masih bisa dilihat, tapi sinkronisasi terbaru perlu internet.</p>
    <button onclick="location.reload()">Coba lagi</button>
    <p class="hint">Aethera akan otomatis pulih saat koneksi kembali.</p>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
